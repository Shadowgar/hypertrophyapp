" width="342" height="88" rx="12" fill="#E7EFE8" stroke="#CDD5CE"/><text x="42" y="381" fill="#176655" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="700">✓ Set 1 saved</text><text x="42" y="405" fill="#173B40" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="400">12 reps × 40 lb · effort unknown</text><text x="42" y="427" fill="#176655" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="12" font-weight="700">Edit · undo latest</text><text x="348" y="427" fill="#176655" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="12" font-weight="700" text-anchor="end">Rest 1:58 · Pause</text><text x="24" y="467" fill="#173B40" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="700">REPS</text><rect x="24" y="479" width="160" height="56" rx="10" fill="#FFFEFA" stroke="#CDD5CE"/><text x="40" y="514" fill="#173B40" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="400">12</text><text x="206" y="467" fill="#173B40" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="700">LOAD · LB</text><rect x="206" y="479" width="160" height="56" rx="10" fill="#FFFEFA" stroke="#CDD5CE"/><text x="222" y="514" fill="#173B40" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="400">40</text><text x="24" y="560" fill="#526568" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="11" font-weight="400">Suggested load shown; you can change it.</text><text x="24" y="590" fill="#173B40" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="700">ACTUAL RPE · OPTIONAL</text><rect x="24" y="602" width="342" height="56" rx="10" fill="#FFFEFA" stroke="#CDD5CE"/><text x="40" y="637" fill="#526568" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="400">—</text><text x="24" y="678" fill="#526568" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="12" font-weight="400">Leave blank if you are unsure.</text><rect x="24" y="699" width="342" height="54" rx="12" fill="#176655"/><text x="195.0" y="733" fill="#FFFEFA" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Save set 2</text><text x="195" y="797" fill="#526568" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="12" font-weight="400" text-anchor="middle">Rest starts after a confirmed save</text></svg><rect x="914" y="319" width="454" height="173" rx="16" fill="#FFFEFA" stroke="#CDD5CE"/><text x="932" y="348" fill="#173B40" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="17" font-weight="700">Authored technique context</text><text x="932" y="374" fill="#526568" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="400">A1 → A2 · paired exercises.</text><text x="932" y="395" fill="#526568" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="400">Follow the cue for this set.</text><text x="932" y="416" fill="#526568" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="400">Keep the prescribed sets and rest.</text><rect x="914" y="511" width="454" height="166" rx="16" fill="#FFFEFA" stroke="#CDD5CE"/><text x="932" y="540" fill="#173B40" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="17" font-weight="700">Customized effort variant</text><text x="932" y="566" fill="#526568" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="400">Target: 2–3 RIR · repetitions left</text><text x="932" y="594" fill="#173B40" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="700">ACTUAL RIR · OPTIONAL</text><rect x="932" y="606" width="418" height="56" rx="10" fill="#FFFEFA" stroke="#CDD5CE"/><text x="948" y="641" fill="#526568" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="400">—</text><rect x="914" y="696" width="454" height="150" rx="16" fill="#F8EBD8"/><text x="938" y="731" fill="#754719" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="400">The keyboard moves the action into view.</text><text x="938" y="758" fill="#754719" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="400">Saving keeps focus in the current task.</text><text x="938" y="785" fill="#754719" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="400">Unconfirmed saves lock the attempted values</text><text x="938" y="812" fill="#754719" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="400">and offer “Retry same set” inline.</text></svg>