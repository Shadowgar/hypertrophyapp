<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc"><title id="title">Theme and appearance</title><desc id="desc">WorkoutApp unified design proposal. Synthetic example. Two independent account preferences: Theme family and Appearance (Light, Dark, Follow Device Settings). Family changes retain appearance. Preview is local, Save requires acknowledgement, Restore saved discards the local preview. Existing unconfigured accounts retain Classic WorkoutApp Dark. This baseline preserves the familiar look without a forced introduction.</desc><style>text{font-family:"DM Sans",Arial,sans-serif;font-variant-numeric:tabular-nums} @font-face{font-family:"DM Sans";src:url("../fonts/DM-Sans.ttf")}</style>
