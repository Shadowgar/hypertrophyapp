name: ARM64 container qualification

on:
  pull_request:
    paths:
      - apps/web/package.json
      - apps/web/package-lock.json
      - apps/web/Dockerfile
      - apps/api/Dockerfile
      - .dockerignore
      - .github/workflows/container-qualification.yml
  workflow_dispatch:
    inputs:
      export_web_runtime:
        description: Retain the built web runtime for isolated browser qualification
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: arm64-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EXPORT_WEB_RUNTIME: ${{ github.event_name == 'workflow_dispatch' && inputs.export_web_runtime && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Build matching native ARM64 images from tracked inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          context="$(mktemp -d "$RUNNER_TEMP/container-context-XXXXXXXX")"
          git archive "$CANDIDATE_SHA" | tar -x -C "$context"
          for service in api web; do
            version_arg=APP_VERSION
            if [ "$service" = web ]; then version_arg=NEXT_PUBLIC_APP_VERSION; fi
            qualification_args=()
            if [ "$service" = web ] && [ "$EXPORT_WEB_RUNTIME" = true ]; then
              # Next rewrites bind this at build time. The opt-in browser artifact
              # must reach only the separately verified disposable local API.
              qualification_args+=(--build-arg SERVER_API_BASE_URL=http://127.0.0.1:55438)
            fi
            docker build --pull --platform linux/arm64 \
              --label "org.opencontainers.image.revision=$CANDIDATE_SHA" \
              --build-arg "$version_arg=$CANDIDATE_SHA" \
              "${qualification_args[@]}" \
              -t "qualification-$service:$CANDIDATE_SHA" \
              -f "$context/apps/$service/Dockerfile" "$context"
          done
      - name: Verify image identity, native dependencies and isolated runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import time

          revision = os.environ['CANDIDATE_SHA']
          receipt = {'revision': revision, 'platform': 'linux/arm64', 'images': {}, 'checks': []}
          receipt['server_api_base_url'] = ('http://127.0.0.1:55438' if os.environ['EXPORT_WEB_RUNTIME'] == 'true'
                                            else 'http://api:8000')
          containers = []

          def docker(*args):
              return subprocess.check_output(['docker', *args], text=True, timeout=90).strip()

          def probe(name, executable, source):
              for attempt in range(60):
                  result = subprocess.run(
                      ['docker', 'exec', name, executable, '-c' if executable == 'python' else '-e', source],
                      text=True, capture_output=True, timeout=15,
                  )
                  if result.returncode == 0:
                      return json.loads(result.stdout)
                  if docker('inspect', '--format', '{{.State.Running}}', name) != 'true':
                      raise RuntimeError(f'{name} exited before its runtime probe passed')
                  time.sleep(1)
              raise RuntimeError(f'{name} did not pass its runtime probe within 60 attempts')

          try:
              for service in ('api', 'web'):
                  tag = f'qualification-{service}:{revision}'
                  info = json.loads(docker('image', 'inspect', tag))[0]
                  assert info['Architecture'] == 'arm64' and info['Os'] == 'linux'
                  assert info['Config']['Labels']['org.opencontainers.image.revision'] == revision
                  receipt['images'][service] = {'id': info['Id'], 'revision': revision}

              api = f'qualification-api-{os.environ["GITHUB_RUN_ID"]}'
              web = f'qualification-web-{os.environ["GITHUB_RUN_ID"]}'
              containers.extend((api, web))
              # No host volumes, ports, external network, inherited environment, or live data.
              # This explicit SQLite target exists only in this container's disposable tmpfs.
              docker('run', '-d', '--name', api, '--network', 'none',
                     '--tmpfs', '/qualification:rw,nosuid,nodev,size=128m',
                     '--env', 'DATABASE_URL=sqlite:////qualification/api.sqlite3',
                     '--env', 'SCHEMA_MANAGEMENT_MODE=bootstrap',
                     '--env', 'JWT_SECRET=synthetic-container-qualification-key-not-a-live-credential',
                     '--env', 'ALLOW_DEV_WIPE_ENDPOINTS=false',
                     '--env', 'LOG_FILE_PATH=/qualification/api.log',
                     f'qualification-api:{revision}', 'sh', '-ec',
                     'python -c "import os; assert os.environ[\'DATABASE_URL\'] == '
                     '\'sqlite:////qualification/api.sqlite3\'; assert not '
                     '__import__(\'pathlib\').Path(\'/qualification/api.sqlite3\').exists()"; '
                     'exec uvicorn app.main:app --host 127.0.0.1 --port 8000')
              api_health = probe(api, 'python',
                  'import json, os, urllib.request; '
                  'data=json.load(urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=5)); '
                  'assert data["status"] == "ok" and data["version"] == os.environ["APP_VERSION"]; '
                  'print(json.dumps(data))')
              assert api_health['version'] == revision
              receipt['checks'].append('api_health_revision_with_disposable_sqlite')

              docker('run', '-d', '--name', web, '--network', 'none', f'qualification-web:{revision}')
              web_version = probe(web, 'node',
                  '(async()=>{const r=await fetch("http://127.0.0.1:3000/version"); '
                  'if(!r.ok)throw Error("version status"); console.log(JSON.stringify(await r.json()));'
                  '})().catch(()=>process.exit(1))')
              assert web_version['version'] == revision
              receipt['checks'].append('matching_web_api_revision')
              for route in ('/', '/login', '/reset-password'):
                  status = probe(web, 'node',
                      '(async()=>{const r=await fetch(' + json.dumps('http://127.0.0.1:3000' + route) + '); '
                      'if(r.status!==200)throw Error("route status"); '
                      'console.log(JSON.stringify({status:r.status}));})().catch(()=>process.exit(1))')
                  assert status['status'] == 200
              receipt['checks'].append('guest_routes_200')
              dependencies = json.loads(docker('exec', web, 'node', '-e', r'''
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const sharp = require('sharp');
          (async () => {
            assert.equal(process.arch, 'arm64');
            for (const installer of ['/usr/local/lib/node_modules/npm', '/usr/local/bin/npm',
                                     '/usr/local/bin/npx', '/usr/local/bin/yarn', '/usr/local/bin/yarnpkg']) {
              assert.equal(fs.existsSync(installer), false, 'runtime package installer must be absent');
            }
            assert.equal(process.report.getReport().header.glibcVersionRuntime, undefined);
            assert.equal(require('next/package.json').version, require('./package.json').dependencies.next);
            const actions = JSON.parse(fs.readFileSync('.next/server/server-reference-manifest.json', 'utf8'));
            assert.deepEqual(Object.keys(actions.node), []);
            assert.deepEqual(Object.keys(actions.edge), []);
            const result = await sharp({create: {width: 2, height: 2, channels: 3, background: '#000'}}).png().toBuffer();
            assert.ok(result.length > 0);
            console.log(JSON.stringify({node: process.version, next: require('next/package.json').version,
              sharp: sharp.versions.sharp, libc: 'musl', server_actions: 0}));
          })().catch(error => { console.error(error.code || error.name); process.exit(1); });
          '''))
              receipt['runtime'] = dependencies
              receipt['checks'].extend(('native_sharp_png', 'musl_runtime', 'zero_server_actions'))
              receipt['status'] = 'passed'
              Path(os.environ['RUNNER_TEMP'], 'container-qualification.json').write_text(json.dumps(receipt, indent=2) + '\n')
              print(json.dumps(receipt, indent=2))
          finally:
              for name in containers:
                  subprocess.run(['docker', 'rm', '-f', name], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          PY
      - name: Retain sanitized qualification receipt only
        uses: actions/upload-artifact@v4
        with:
          name: arm64-container-qualification-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}/container-qualification.json
          if-no-files-found: error
          retention-days: 30
      - name: Scan exact native images and retain SBOMs
        shell: bash
        env:
          TRIVY_IMAGE: aquasec/trivy:0.69.3@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c
        run: |
          set -euo pipefail
          reports="$RUNNER_TEMP/container-security"
          cache="$RUNNER_TEMP/trivy-cache"
          mkdir -p "$reports" "$cache"
          for service in api web; do
            image_id="$(docker image inspect --format '{{.Id}}' "qualification-$service:$CANDIDATE_SHA")"
            docker run --rm --cpus 2 --memory 3g \
              -v /var/run/docker.sock:/var/run/docker.sock:ro \
              -v "$cache:/root/.cache/trivy" -v "$reports:/reports" \
              "$TRIVY_IMAGE" image --image-src docker --parallel 1 --timeout 15m \
              --skip-java-db-update --offline-scan --scanners vuln --format json \
              --output "/reports/$service-vulnerabilities.json" "$image_id"
            docker run --rm --cpus 2 --memory 3g \
              -v /var/run/docker.sock:/var/run/docker.sock:ro \
              -v "$cache:/root/.cache/trivy" -v "$reports:/reports" \
              "$TRIVY_IMAGE" image --image-src docker --parallel 1 --timeout 15m \
              --skip-db-update --skip-java-db-update --offline-scan --format cyclonedx \
              --output "/reports/$service-sbom.cdx.json" "$image_id"
          done
          docker run --rm --network none --entrypoint python "qualification-api:$CANDIDATE_SHA" -c '
          import importlib.metadata as m
          assert all(d.metadata["Name"].lower() != "pip" for d in m.distributions())
          print("\n".join(sorted(d.metadata["Name"]+"=="+d.version for d in m.distributions())))
          ' > "$reports/api-installed.txt"
          # The internal editable package is reviewed as source, not sent to PyPI.
          sed '/^core-engine==/d' "$reports/api-installed.txt" > "$reports/api-public-packages.txt"
          python3 -m venv "$RUNNER_TEMP/audit-venv"
          "$RUNNER_TEMP/audit-venv/bin/pip" install 'pip-audit==2.10.1'
          audit_status=0
          "$RUNNER_TEMP/audit-venv/bin/pip-audit" --disable-pip --no-deps --format json \
            -r "$reports/api-public-packages.txt" -o "$reports/api-pip-audit.json" || audit_status=$?
          # Exit 1 means findings, which are retained for disposition; scanner
          # execution errors must fail qualification instead of looking clean.
          test "$audit_status" -le 1
          python3 - <<'PY'
          from collections import Counter
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'container-security'
          receipt = json.loads((root.parent / 'container-qualification.json').read_text())
          summary = {'revision': receipt['revision'], 'images': receipt['images'],
                     'scan_completed': True, 'findings_require_disposition': True,
                     'internal_package_excluded_from_pypi': 'core-engine', 'images_scanned': {}}
          for service in ('api', 'web'):
              report = json.loads((root / f'{service}-vulnerabilities.json').read_text())
              counts = Counter(v['Severity'] for result in report.get('Results', [])
                               for v in result.get('Vulnerabilities', []))
              summary['images_scanned'][service] = dict(counts)
          audit = json.loads((root / 'api-pip-audit.json').read_text())
          summary['python_advisories'] = sum(len(d['vulns']) for d in audit['dependencies'])
          (root / 'summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps(summary, indent=2))
          PY
      - name: Retain scan results at every severity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm64-security-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}/container-security/
          if-no-files-found: error
          retention-days: 30
      - name: Export the exact built web runtime for isolated browser testing
        if: github.event_name == 'workflow_dispatch' && inputs.export_web_runtime
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --entrypoint tar "qualification-web:$CANDIDATE_SHA" \
            -C /app/apps/web -czf - . > "$RUNNER_TEMP/web-runtime.tar.gz"
          (cd "$RUNNER_TEMP" && sha256sum web-runtime.tar.gz > web-runtime.sha256)
      - name: Retain optional web runtime artifact
        if: github.event_name == 'workflow_dispatch' && inputs.export_web_runtime
        uses: actions/upload-artifact@v4
        with:
          name: arm64-web-runtime-${{ env.CANDIDATE_SHA }}
          path: |
            ${{ runner.temp }}/web-runtime.tar.gz
            ${{ runner.temp }}/web-runtime.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
