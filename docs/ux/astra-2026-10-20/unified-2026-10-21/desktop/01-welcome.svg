<rect x="26" y="31" width="6" height="23" rx="2" fill="#C9383F" data-fill-token="action_fill"/>
<rect x="36" y="37" width="6" height="17" rx="2" fill="#C9383F" data-fill-token="action_fill"/>
<text x="53" y="50" fill="#F5F5F5" data-fill-token="text_primary" font-size="22" font-weight="700" text-anchor="start">WorkoutApp</text>
<path d="M20 74 L1420 74" fill="none" stroke="#3B3B3B" stroke-width="1"/>
<text x="260" y="116" fill="#FF858B" data-fill-token="accent_text" font-size="13" font-weight="700" text-anchor="start">HOME</text>
<text x="260" y="156" fill="#F5F5F5" data-fill-token="text_primary" font-size="30" font-weight="700" text-anchor="start">Ready for your next session?</text>
<text x="260" y="183" fill="#C2C2C2" data-fill-token="text_secondary" font-size="16" font-weight="400" text-anchor="start">A clear plan. Your actual progress.</text>
<rect x="260" y="222" width="670" height="92" rx="12" fill="#191919" data-fill-token="surface" stroke="#3B3B3B" stroke-width="1" data-stroke-token="border_subtle"/>
<text x="276" y="251" fill="#F5F5F5" data-fill-token="text_primary" font-size="18" font-weight="600" text-anchor="start">Train with your program</text>
<text x="276" y="281" fill="#C2C2C2" data-fill-token="text_secondary" font-size="15" font-weight="400" text-anchor="start">Follow an Authored program or choose to build a Customized one.</text>
<rect x="260" y="326" width="670" height="92" rx="12" fill="#191919" data-fill-token="surface" stroke="#858585" stroke-width="1" data-stroke-token="border_control"/>
<text x="276" y="355" fill="#F5F5F5" data-fill-token="text_primary" font-size="18" font-weight="600" text-anchor="start">Already training here?</text>
<text x="276" y="385" fill="#C2C2C2" data-fill-token="text_secondary" font-size="15" font-weight="400" text-anchor="start">Sign in to return to your workouts and history.</text>
<text x="914" y="355" fill="#FF858B" data-fill-token="accent_text" font-size="20" font-weight="400" text-anchor="end">›</text>
