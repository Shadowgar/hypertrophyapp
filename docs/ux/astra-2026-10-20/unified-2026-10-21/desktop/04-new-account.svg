<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">Make it yours</title><desc id="desc">WorkoutApp unified design proposal. Synthetic example. Create only a new account after explicit submit; do not choose a program or run generation as a hidden authentication side effect. Existing accounts route to sign-in.</desc><style>text{font-family:"DM Sans",Arial,sans-serif;font-variant-numeric:tabular-nums} @font-face{font-family:"DM Sans";src:url("../fonts/DM-Sans.ttf")}</style>
<rect x="0" y="0" width="1440" height="900" rx="0" fill="#101010" data-fill-token="canvas"/>
<rect x="26" y="31" width="6" height="23" rx="2" fill="#C9383F" data-fill-token="action_fill"/>
<rect x="36" y="37" width="6" height="17" rx="2" fill="#C9383F" data-fill-token="action_fill"/>
<text x="53" y="50" fill="#F5F5F5" data-fill-token="text_primary" font-size="22" font-weight="700" text-anchor="start">WorkoutApp</text>
<path d="M20 74 L1420 74" fill="none" stroke="#3B3B3B" stroke-width="1"/>
<text x="260" y="116" fill="#FF858B" data-fill-token="accent_text" font-size="13" font-weight="700" text-anchor="start">ACCOUNT</text>
<text x="260" y="156" fill="#F5F5F5" data-fill-token="text_primary" font-size="30" font-weight="700" text-anchor="start">Make it yours</text>
<text x="260" y="183" fill="#C2C2C2" data-fill-token="text_secondary" font-size="16" font-weight="400" text-anchor="start">Create your account, then choose a program.</text>
<text x="260" y="233" fill="#C2C2C2" data-fill-token="text_secondary" font-size="14" font-weight="500" text-anchor="start">Email</text>
<rect x="260" y="243" width="670" height="52" rx="10" fill="#191919" data-fill-token="input_fill" stroke="#858585" stroke-width="1" data-stroke-token="border_control"/>
<text x="274" y="277.0" fill="#F5F5F5" data-fill-token="text_primary" font-size="16" font-weight="600" text-anchor="start">alex@example.com</text>
<text x="260" y="321" fill="#C2C2C2" data-fill-token="text_secondary" font-size="14" font-weight="500" text-anchor="start">Password</text>
<rect x="260" y="331" width="670" height="52" rx="10" fill="#191919" data-fill-token="input_fill" stroke="#858585" stroke-width="1" data-stroke-token="border_control"/>
<text x="274" y="365.0" fill="#F5F5F5" data-fill-token="text_primary" font-size="16" font-weight="600" text-anchor="start">••••••••••••</text>
<rect x="260" y="398" width="670" height="48" rx="12" fill="#191919" data-fill-token="surface" stroke="#858585" stroke-width="1" data-stroke-token="border_control"/>
<text x="595.0" y="427.0" fill="#F5F5F5" data-fill-token="text_primary" font-size="15" font-weight="600" text-anchor="middle">Show password</text>
<rect x="260" y="458" width="670" height="92" rx="12" fill="#191919" data-fill-token="surface" stroke="#3B3B3B" stroke-width="1" data-stroke-token="border_subtle"/>
<text x="276" y="487" fill="#F5F5F5" data-fill-token="text_primary" font-size="18" font-weight="600" text-anchor="start">Your choice comes next</text>
<text x="276" y="517" fill="#C2C2C2" data-fill-token="text_secondary" font-size="15" font-weight="400" text-anchor="start">You can review your setup before starting training.</text>
<rect x="260" y="716" width="310" height="48" rx="12" fill="#C9383F" data-fill-token="action_fill"/>
<text x="415.0" y="745.0" fill="#FFFFFF" data-fill-token="action_text" font-size="15" font-weight="600" text-anchor="middle">Create account</text>
<rect x="586" y="716" width="210" height="48" rx="12" fill="#191919" data-fill-token="surface" stroke="#858585" stroke-width="1" data-stroke-token="border_control"/>
<text x="691.0" y="745.0" fill="#F5F5F5" data-fill-token="text_primary" font-size="15" font-weight="600" text-anchor="middle">I already have an account</text>
<rect x="968" y="104" width="436" height="96" rx="16" fill="#232323" data-fill-token="surface_raised"/>
<text x="988" y="138" fill="#F5F5F5" data-fill-token="text_primary" font-size="18" font-weight="600" text-anchor="start">WorkoutApp</text>
<text x="988" y="171" fill="#C2C2C2" data-fill-token="text_secondary" font-size="16" font-weight="400" text-anchor="start">Your setup</text>
<rect x="968" y="220" width="436" height="92" rx="12" fill="#191919" data-fill-token="surface" stroke="#3B3B3B" stroke-width="1" data-stroke-token="border_subtle"/>
<text x="984" y="249" fill="#F5F5F5" data-fill-token="text_primary" font-size="18" font-weight="600" text-anchor="start">Your setup</text>
<text x="984" y="279" fill="#C2C2C2" data-fill-token="text_secondary" font-size="15" font-weight="400" text-anchor="start">Account → Program → Equipment → Review</text>
<rect x="968" y="324" width="436" height="114" rx="12" fill="#191919" data-fill-token="surface" stroke="#3B3B3B" stroke-width="1" data-stroke-token="border_subtle"/>
<text x="984" y="353" fill="#F5F5F5" data-fill-token="text_primary" font-size="18" font-weight="600" text-anchor="start">Keep your choices clear</text>
<text x="984" y="383" fill="#C2C2C2" data-fill-token="text_secondary" font-size="15" font-weight="400" text-anchor="start">Review each step before saving. Optional answers</text>
<text x="984" y="405" fill="#C2C2C2" data-fill-token="text_secondary" font-size="15" font-weight="400" text-anchor="start">can stay unknown.</text>
<rect x="968" y="450" width="436" height="92" rx="12" fill="#191919" data-fill-token="surface" stroke="#3B3B3B" stroke-width="1" data-stroke-token="border_subtle"/>
<text x="984" y="479" fill="#F5F5F5" data-fill-token="text_primary" font-size="18" font-weight="600" text-anchor="start">Already have an account?</text>
<text x="984" y="509" fill="#C2C2C2" data-fill-token="text_secondary" font-size="15" font-weight="400" text-anchor="start">Use Sign in to return to your saved training.</text>
<text x="972" y="852" fill="#A3A3A3" data-fill-token="text_muted" font-size="14" font-weight="400" text-anchor="start">WorkoutApp  /  Account</text></svg>