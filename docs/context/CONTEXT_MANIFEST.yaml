authority_notes:
- Owner product outcomes are distinct from Proposed mechanisms, implementation, verification and release acceptance.
- D-001 through D-022 retained; no Proposed ADR supersession.
- Authored Phase 1 / Phase 2 separate; generated cannot modify authored templates.
- GenerationProfile-first; deterministic auditable core; AI has no runtime prescription authority.
- Metadata scoring remains frozen. Runtime rules and source/provenance assets are compatibility boundaries.
change_gates:
  required_before_edit:
  - Read common and all affected groups, not every group.
  - Confirm authorized scope, decision status, mode/source/data boundaries and applicable plan status.
  - For authorized behavior changes, meaningful tests and deterministic trace/logging updates as appropriate.
  - Verify disposable targets and environment before test/import/startup/DDL; follow DB_SAFETY_LOCK.md.
  historical_tooling_warning: Legacy mini scripts still read Master_Plan/backlog paths and cannot authorize implementation.
    Tooling migration is deferred.
