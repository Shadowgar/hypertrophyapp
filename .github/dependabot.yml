version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      routine-npm:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      security-npm:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /apps/api
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      routine-pip:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      security-pip:
        applies-to: security-updates
        patterns: ["*"]
