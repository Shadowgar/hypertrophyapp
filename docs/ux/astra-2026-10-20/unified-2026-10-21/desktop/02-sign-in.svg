<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">Welcome back</title><desc id="desc">WorkoutApp unified design proposal. Synthetic example. Use persistent email/password labels, a 48px Show password control and one submit. Pending disables duplicate sign-in. Successful authentication preserves the full safe return path and query without onboarding writes; inline failure retains email.</desc><style>text{font-family:"DM Sans",Arial,sans-serif;font-variant-numeric:tabular-nums} @font-face{font-family:"DM Sans";src:url("../fonts/DM-Sans.ttf")}</style>
