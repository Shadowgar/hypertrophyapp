<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">Set saved and rest</title><desc id="desc">WorkoutApp unified design proposal. Synthetic example. After authoritative acknowledgement, the reserved region announces Set 1 saved and a rest timer once. Set 2 composer occupies exactly the same coordinates, with retained weight and blank reps. Its Save stays disabled until valid reps. Receipt actuals appear only in Recorded sets.</desc><style>text{font-family:"DM Sans",Arial,sans-serif;font-variant-numeric:tabular-nums} @font-face{font-family:"DM Sans";src:url("../../fonts/DM-Sans.ttf")}</style>
