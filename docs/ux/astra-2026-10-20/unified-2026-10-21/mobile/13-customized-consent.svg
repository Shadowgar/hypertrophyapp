<text x="74" y="440" fill="#F5F5F5" data-fill-token="text_primary" font-size="16" font-weight="600" text-anchor="start">I choose Customized</text>
<text x="74" y="462" fill="#C2C2C2" data-fill-token="text_secondary" font-size="14" font-weight="400" text-anchor="start">Allow WorkoutApp to create an</text>
<text x="74" y="482" fill="#C2C2C2" data-fill-token="text_secondary" font-size="14" font-weight="400" text-anchor="start">original program from the inputs I</text>
<text x="74" y="502" fill="#C2C2C2" data-fill-token="text_secondary" font-size="14" font-weight="400" text-anchor="start">review.</text>
<rect x="20" y="529" width="350" height="114" rx="12" fill="#191919" data-fill-token="surface" stroke="#3B3B3B" stroke-width="1" data-stroke-token="border_subtle"/>
<text x="36" y="558" fill="#F5F5F5" data-fill-token="text_primary" font-size="18" font-weight="600" text-anchor="start">Review before activation</text>
<text x="36" y="588" fill="#C2C2C2" data-fill-token="text_secondary" font-size="15" font-weight="400" text-anchor="start">You will see the proposed program,</text>
<text x="36" y="610" fill="#C2C2C2" data-fill-token="text_secondary" font-size="15" font-weight="400" text-anchor="start">dates and workload first.</text>
