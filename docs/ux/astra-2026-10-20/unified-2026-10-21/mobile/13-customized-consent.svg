<text x="20" y="140" fill="#F5F5F5" data-fill-token="text_primary" font-size="27" font-weight="700" text-anchor="start">Build a Customized</text>
<text x="20" y="175" fill="#F5F5F5" data-fill-token="text_primary" font-size="27" font-weight="700" text-anchor="start">program</text>
<text x="20" y="202" fill="#C2C2C2" data-fill-token="text_secondary" font-size="16" font-weight="400" text-anchor="start">A separate program, built around your</text>
<text x="20" y="225" fill="#C2C2C2" data-fill-token="text_secondary" font-size="16" font-weight="400" text-anchor="start">inputs.</text>
