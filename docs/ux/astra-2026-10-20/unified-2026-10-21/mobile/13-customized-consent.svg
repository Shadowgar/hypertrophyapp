<text x="36" y="323" fill="#C2C2C2" data-fill-token="text_secondary" font-size="15" font-weight="400" text-anchor="start">Customized creates an original</text>
<text x="36" y="345" fill="#C2C2C2" data-fill-token="text_secondary" font-size="15" font-weight="400" text-anchor="start">program. Your Authored templates and</text>
<text x="36" y="367" fill="#C2C2C2" data-fill-token="text_secondary" font-size="15" font-weight="400" text-anchor="start">history stay intact.</text>
