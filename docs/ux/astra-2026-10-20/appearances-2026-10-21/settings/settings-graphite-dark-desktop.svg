ont-weight="400">This device is currently using Dark.</text><text x="208" y="741" font-size="13" fill="#BDBDBD" font-weight="400">Follow Device Settings uses each device’s own appearance.</text><rect x="948" y="242" width="312" height="256" rx="14" fill="#2D2D2D"/><text x="972" y="277" font-size="16" fill="#F0F0F0" font-weight="650">Preview · Not saved</text><text x="972" y="309" font-size="13" fill="#BDBDBD" font-weight="400">You are previewing your selection.</text><text x="972" y="331" font-size="13" fill="#BDBDBD" font-weight="400">Your account has not changed.</text><path d="M972 352H1236" fill="none" stroke="#858585"/><text x="972" y="380" font-size="14" fill="#F0F0F0" font-weight="400">Save preferences to apply this</text><text x="972" y="402" font-size="14" fill="#F0F0F0" font-weight="400">choice across mobile and desktop.</text><text x="972" y="437" font-size="12" fill="#BDBDBD" font-weight="400">Follow Device Settings can look</text><text x="972" y="457" font-size="12" fill="#BDBDBD" font-weight="400">different on each of your devices.</text><rect x="180" y="796" width="223" height="48" rx="9" fill="#79B8FF"/><text x="219" y="826" font-size="15" fill="#111111" font-weight="650">Save preferences</text><rect x="427" y="796" width="144" height="48" rx="9" fill="#191919" stroke="#858585" stroke-width="1"/><text x="452" y="826" font-size="14" fill="#F0F0F0" font-weight="500">Restore saved</text><text x="946" y="827" font-size="12" fill="#BDBDBD" font-weight="400">Preview only · Typography provisional</text></g></svg>