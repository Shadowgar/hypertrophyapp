<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">Ready for your next session?</title><desc id="desc">WorkoutApp unified design proposal. Synthetic example. Create account starts a new draft setup. Sign in opens the dedicated account flow without writing profile or training preferences.</desc><style>text{font-family:"DM Sans",Arial,sans-serif;font-variant-numeric:tabular-nums} @font-face{font-family:"DM Sans";src:url("../fonts/DM-Sans.ttf")}</style>
