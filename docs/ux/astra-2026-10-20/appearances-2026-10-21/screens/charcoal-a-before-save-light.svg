<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc"><title id="title">10-working-before-mobile.svg</title><desc id="desc">Guided Authored working set. All loads and source targets are illustrative; no prescription calculation is proposed here. Static design sketch. Synthetic journey, not real user data or backend qualification.</desc><rect width="390" height="844" fill="#FAFAFA" /><text x="24" y="38" fill="#242424" font-family="Libre Baskerville, Georgia, DejaVu Serif, serif" font-size="21" font-weight="700">next step</text><rect x="322" y="12" width="44" height="44" rx="22" fill="#FFFFFF" stroke="#CDCDCD" /><text x="344" y="40" fill="#242424" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="700" text-anchor="middle">JR</text><text x="24" y="70" fill="#484848" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="10" font-weight="700">DIRECTION A  /  SYNTHETIC JOURNEY</text><text x="24" y="106" fill="#242424" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="11" font-weight="700">‹  SESSION OVERVIEW</text><text x="24" y="145" fill="#242424" font-family="Libre Baskerville, Georgia, DejaVu Serif, serif" font-size="27" font-weight="400">Lat pull-around</text><text x="24" y="174" fill="#484848" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="400">Authored Phase 1 · exercise 1 of 8</text><rect x="24" y="191" width="110" height="36" rx="18" fill="#FFFFFF" stroke="#CDCDCD" /><text x="79" y="214" fill="#484848" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Warm-up</text><rect x="140" y="191" width="110" height="36" rx="18" fill="#242424" /><text x="195" y="214" fill="#FFFFFF" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Work</text><rect x="256" y="191" width="110" height="36" rx="18" fill="#FFFFFF" stroke="#CDCDCD" /><text x="311" y="214" fill="#484848" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Rest</text><rect x="24" y="244" width="342" height="94" rx="16" fill="#FFFFFF" stroke="#CDCDCD" /><text x="42" y="273" fill="#242424" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="11" font-weight="700">SET 1 OF 3</text><text x="42" y="301" fill="#242424" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="700">12 reps  ·  target RPE 8</text><text x="42" y="323" fill="#484848" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="11" font-weight="400">Your target for this set</text><rect x="24" y="354" width="342" height="88" rx="12" fill="#FFFFFF" stroke="#CDCDCD" /><text x="42" y="381" fill="#242424" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="700">Ready when you are</text><text x="42" y="405" fill="#484848" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="400">Enter what you actually perform.</text><text x="42" y="427" fill="#484848" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="12" font-weight="400">Your save result will appear here.</text><text x="24" y="467" fill="#242424" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="700">REPS</text><rect x="24" y="479" width="160" height="56" rx="10" fill="#FFFFFF" stroke="#737373" /><text x="40" y="514" fill="#242424" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="400">12</text><text x="206" y="467" fill="#242424" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="700">LOAD · LB</text><rect x="206" y="479" width="160" height="56" rx="10" fill="#FFFFFF" stroke="#737373" /><text x="222" y="514" fill="#242424" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="400">40</text><t