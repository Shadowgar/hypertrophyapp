<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="settings-title settings-desc"><title id="settings-title">graphite dark Theme and appearance desktop review</title><desc id="settings-desc">Review-only draft preview. Theme family Graphite; appearance Follow Device Settings; synthetic device resolution dark. Three families each offer light and dark, totaling six styles. No preference is saved. DM Sans is provisional typography.</desc><g font-family="DM Sans, sans-serif"><rect x="0" y="0" width="1440" height="900" rx="0" fill="#111111"/><text x="48" y="48" font-size="20" fill="#F0F0F0" font-weight="700">WorkoutApp</text><text x="1100" y="47" font-size="15" fill="#BDBDBD" font-weight="400">Settings</text><text x="1224" y="47" font-size="15" fill="#F0F0F0" font-weight="400">Theme &amp; appearance</text><path d="M48 70H1392" fill="none" stroke="#858585"/><text x="180" y="125" font-size="14" fill="#BDBDBD" font-weight="400">‹  Back to Settings</text><text x="180" y="178" font-size="32" fill="#F0F0F0" font-weight="650">Theme &amp; appearance</text><text x="180" y="208" font-size="16" fill="#BDBDBD" font-weight="400">Make WorkoutApp feel like yours. Your saved preferences travel with your account.</text><rect x="180" y="242" width="740" height="530" rx="16" fill="#191919" stroke="#858585" stroke-width="1"/><text x="208" y="282" font-size="18" fill="#F0F0F0" font-weight="650">Theme family</text><text x="208" y="307" font-size="14" fill="#BDBDBD" font-weight="400">Every family includes light and dark. Choose the style you like.</text><rect x="208" y="327" width="212" height="161" rx="10" fill="#2D2D2D" stroke="#79B8FF" stroke-width="2"/><rect x="224" y="342" width="84" height="76" rx="5" fill="#F3F3F3" stroke="#737373" stroke-width="1"/><rect x="229" y="347" width="74" height="4" rx="2" fill="#1B1B1B"/><rect x="229" y="356" width="74" height="56" rx="2" fill="#FFFFFF"/><rect x="233" y="361" width="58" height="3