<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">D04 · Stable execution and variants</title><desc id="desc">Working-set before and after designs preserve control coordinates; context variants preserve source and effort boundaries Direction A. Documentation-only synthetic design sketch.</desc><rect width="1440" height="900" fill="#F6F3EB"/><rect x="0" y="0" width="1440" height="84" rx="0" fill="#FFFEFA"/><text x="48" y="50" fill="#173B40" font-family="Libre Baskerville, Georgia, DejaVu Serif, serif" font-size="27" font-weight="700">next step</text><rect x="359" y="22" width="111" height="44" rx="12" fill="#E7EFE8"/><text x="414" y="50" fill="#176655" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Home</text><text x="547" y="50" fill="#526568" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="middle">Week</text><text x="680" y="50" fill="#526568" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="middle">History</text><text x="813" y="50" fill="#526568" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="middle">Library</text><text x="946" y="50" fill="#526568" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="middle">Check-in</text><text x="1079" y="50" fill="#526568" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="middle">Settings</text><text x="1386" y="50" fill="#173B40" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="700" text-anchor="end">JR</text><text x="48" y="119" fill="#526568" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="11" font-weight="700">DIRECTION A  /  SYNTHETIC JOURNEY  /  DESIGN SKETCH</text><text x="72" y="174" fill="#176655" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="12" font-weight="700">EXECUTION · GUIDED STAGES</text><text x="72" y="226" fill="#173B40" font-family="Libre Baskerville, Georgia, DejaVu Serif, serif" font-size="39" font-weight="400">The next action stays put.</text><text x="72" y="262" fill="#526568" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="16" font-weight="400">Same geometry before and after saving. One receipt, one status region, no automatic effort entry.</text><text x="72" y="302" fill="#176655" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="11" font-weight="700">BEFORE SAVE</text><svg x="72" y="319" width="390" height="527" viewBox="0 232 390 612"><rect width="390" height="844" fill="#F6F3EB"/><text x="24" y="38" fill="#173B40" font-family="Libre Baskerville, Georgia, DejaVu Serif, serif" font-size="21" font-weight="700">next step</text><rect x="322" y="12" width="44" height="44" rx="22" fill="#FFFEFA" stroke="#CDD5CE"/><text x="344" y="40" fill="#173B40" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="700" text-anchor="middle">JR</text><text x="24" y="70" fill="#526568" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="10" font-weight="700">DIRECTION A  /  SYNTHETIC JOURNEY</text><text x="24" y="106" fill="#176655" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="11" font-weight="700">‹  SESSION OVERVIEW</text><text x="24" y="145" fill="#173B40" font-family="Libre Baskerville, Georgia, DejaVu Serif, serif" font-size="27" font-weight="400">Lat pull-around</text><text x="24" y="174" fill="#526568" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="400">Authored Phase 1 · exercise 1 of 8</text><rect x="24" y="191" width="110" height="36" rx="18" fill="#FFFEFA" stroke="#CDD5CE"/><text x="79" y="214" fill="#526568" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="1