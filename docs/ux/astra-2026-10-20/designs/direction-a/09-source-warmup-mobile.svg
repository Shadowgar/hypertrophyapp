<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc"><title id="title">09 · Warm-up</title><desc id="desc">Source warm-up count formatted once; actual entry and working sets stay separate Static design sketch. Synthetic journey, not real user data or backend qualification.</desc><rect width="390" height="844" fill="#1C1D1A"/><text x="24" y="38" fill="#F1F1E7" font-family="Libre Baskerville, Georgia, DejaVu Serif, serif" font-size="21" font-weight="700">next step</text><rect x="322" y="12" width="44" height="44" rx="22" fill="#282A25" stroke="#788272"/><text x="344" y="40" fill="#F1F1E7" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="700" text-anchor="middle">JR</text><text x="24" y="70" fill="#BBC2B5" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="10" font-weight="700">DIRECTION A  /  SYNTHETIC JOURNEY</text><text x="24" y="106" fill="#A9DDBD" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="11" font-weight="700">‹  SESSION OVERVIEW</text><text x="24" y="145" fill="#F1F1E7" font-family="Libre Baskerville, Georgia, DejaVu Serif, serif" font-size="27" font-weight="400">Lat pull-around</text><text x="24" y="174" fill="#BBC2B5" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="400">Authored Phase 1 · exercise 1 of 8</text><rect x="24" y="191" width="110" height="36" rx="18" fill="#9FD5B5"/><text x="79" y="214" fill="#16261C" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Warm-up</text><rect x="140" y="191" width="110" height="36" rx="18" fill="#282A25" stroke="#788272"/><text x="195" y="214" fill="#BBC2B5" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Work</text><rect x="256" y="191" width="110" height="36" rx="18" fill="#282A25" stroke="#788272"/><text x="311" y="214" fill="#BBC2B5" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Rest</text><rect x="24" y="245" width="342" height="114" rx="16" fill="#282A25" stroke="#788272"/><text x="42" y="274" fill="#F1F1E7" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="17" font-weight="700">1 source warm-up</text><text x="42" y="300" fill="#BBC2B5" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="400">From your Authored program.</text><text x="42" y="321" fill="#BBC2B5" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="400">Working sets begin after this step.</text><rect x="24" y="378" width="342" height="68" rx="12" fill="#283D33"/><text x="42" y="405" fill="#BBC2B5" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="12" font-weight="400">No suggested warm-up load is available yet.</text><text x="42" y="426" fill="#BBC2B5" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="12" font-weight="400">Enter the actual load and reps you choose.</text><text x="24" y="482" fill="#F1F1E7" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="700">ACTUAL REPS</text><rect x="24" y="494" width="160" height="56" rx="10" fill="#282A25" stroke="#788272"/><text x="40" y="529" fill="#BBC2B5" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="400">—</text><text x="206" y="482" fill="#F1F1E7" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="700">ACTUAL LOAD · LB</text><rect x="206" y="494" width="160" height="56" rx="10" fill="#282A25" stroke="#788272"/><text x="222" y="529" fill="#BBC2B5" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="400">—</text><text x="24" y="599" fill="#F1F1E7" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="700">ACTUAL RPE · OPTIONAL</text><rect x="24" y="611" width="342" height="56" rx="10" fill="#282A25" stroke="#788272"/><text x="40" y="646" fill="#BBC2B5" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="400">—</text><rect x="24" y="703" width="342" height="54" rx="12" fill="#9FD5B5"/><text x="195.0" y="737" fill="#16261C" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Save warm-up</text><text x="195" y="803" fill="#BBC2B5" font-family="DM Sans, Arial, DejaVu Sans, sans-serif" font-size="11" font-weight="400" text-anchor="middle">Warm-up records do not count as working sets.</text></svg>