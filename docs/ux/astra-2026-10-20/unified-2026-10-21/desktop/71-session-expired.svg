<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">Sign in to continue</title><desc id="desc">WorkoutApp unified design proposal. Synthetic example. Auth expiry pauses writes and preserves only a securely account-scoped local attempt where supported. Reauthenticate to the same account, then reconcile. Switching account never adopts or exposes the previous account draft.</desc><style>text{font-family:"DM Sans",Arial,sans-serif;font-variant-numeric:tabular-nums} @font-face{font-family:"DM Sans";src:url("../fonts/DM-Sans.ttf")}</style>
<rect x="0" y="0" width="1440" height="900" rx="0" fill="#101010" data-fill-token="canvas"/>
<rect x="26" y="31" width="6" height="23" rx="2" fill="#C9383F" data-fill-token="action_fill"/>
<rect x="36" y="37" width="6" height="17" rx="2" fill="#C9383F" data-fill-token="action_fill"/>
<text x="53" y="50" fill="#F5F5F5" data-fill-token="text_primary" font-size="22" font-weight="700" text-anchor="start">WorkoutApp</text>
<path d="M20 74 L1420 74" fill="none" stroke="#3B3B3B" stroke-width="1"/>
<text x="260" y="116" fill="#FF858B" data-fill-token="accent_text" font-size="13" font-weight="700" text-anchor="start">ACCOUNT</text>
<text x="260" y="156" fill="#F5F5F5" data-fill-token="text_primary" font-size="30" font-weight="700" text-anchor="start">Sign in to continue</text>
<text x="260" y="183" fill="#C2C2C2" data-fill-token="text_secondary" font-size="16" font-weight="400" text-anchor="start">Your session has expired.</text>
<rect x="260" y="222" width="670" height="73" rx="12" fill="#232323" data-fill-token="status_surface" stroke="#858585" stroke-width="1" data-stroke-token="border_control"/>
<text x="276" y="250" fill="#EBC17A" data-fill-token="warning_text" font-size="16" font-weight="600" text-anchor="start">Working-set entry held here</text>
<text x="276" y="274" fill="#C2C2C2" data-fill-token="text_secondary" font-size="14" font-weight="400" text-anchor="start">40 lb × 12 reps · save not confirmed</text>
<rect x="260" y="307" width="670" height="92" rx="12" fill="#191919" data-fill-token="surface" stroke="#3B3B3B" stroke-width="1" data-stroke-token="border_subtle"/>
<text x="276" y="336" fill="#F5F5F5" data-fill-token="text_primary" font-size="18" font-weight="600" text-anchor="start">Check the save after signing in</text>
<text x="276" y="366" fill="#C2C2C2" data-fill-token="text_secondary" font-size="15" font-weight="400" text-anchor="start">We will reconcile this attempt before you enter another set.</text>
<rect x="260" y="716" width="320" height="48" rx="12" fill="#C9383F" data-fill-token="action_fill"/>
<text x="420.0" y="745.0" fill="#FFFFFF" data-fill-token="action_text" font-size="15" font-weight="600" text-anchor="middle">Sign in</text>
<rect x="968" y="104" width="436" height="96" rx="16" fill="#232323" data-fill-token="surface_raised"/>
<text x="988" y="138" fill="#F5F5F5" data-fill-token="text_primary" font-size="18" font-weight="600" text-anchor="start">WorkoutApp</text>
<text x="988" y="171" fill="#C2C2C2" data-fill-token="text_secondary" font-size="16" font-weight="400" text-anchor="start">Your training, in view</text>
<rect x="968" y="220" width="436" height="114" rx="12" fill="#191919" data-fill-token="surface" stroke="#3B3B3B" stroke-width="1" data-stroke-token="border_subtle"/>
<text x="984" y="249" fill="#F5F5F5" data-fill-token="text_primary" font-size="18" font-weight="600" text-anchor="start">Return safely</text>
<text x="984" y="279" fill="#C2C2C2" data-fill-token="text_secondary" font-size="15" font-weight="400" text-anchor="start">Sign in to the same account to continue this</text>
<text x="984" y="301" fill="#C2C2C2" data-fill-token="text_secondary" font-size="15" font-weight="400" text-anchor="start">workout.</text>
<rect x="968" y="346" width="436" height="114" rx="12" fill="#191919" data-fill-token="surface" stroke="#3B3B3B" stroke-width="1" data-stroke-token="border_subtle"/>
<text x="984" y="375" fill="#F5F5F5" data-fill-token="text_primary" font-size="18" font-weight="600" text-anchor="start">Check the saved state</text>
<text x="984" y="405" fill="#C2C2C2" data-fill-token="text_secondary" font-size="15" font-weight="400" text-anchor="start">The pending attempt must be checked before</text>
<text x="984" y="427" fill="#C2C2C2" data-fill-token="text_secondary" font-size="15" font-weight="400" text-anchor="start">another set is sent.</text>
<text x="972" y="852" fill="#A3A3A3" data-fill-token="text_muted" font-size="14" font-weight="400" text-anchor="start">WorkoutApp  /  Account</text></svg>