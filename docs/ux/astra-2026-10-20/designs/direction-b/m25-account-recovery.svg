<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc"><title id="title">Recover access</title><desc id="desc">Recover access in a guest account shell, without signed-in navigation or account avatar. Training Atlas conceptual mockup. Synthetic data. Not implemented.</desc><rect width="390" height="844" fill="#101A16"/>
<rect x="0" y="0" width="390" height="24" rx="0" fill="#142E25"/>
<text x="195" y="16" fill="#EDF3EC" font-family="IBM Plex Sans,Arial,Helvetica,sans-serif" font-size="10" font-weight="600" text-anchor="middle">DIRECTION B  ·  SYNTHETIC DESIGN SAMPLE</text>
<text x="20" y="58" fill="#EDF3EC" font-family="Libre Baskerville,Georgia,serif" font-size="28" font-weight="600" text-anchor="start">atlas</text>
<text x="114" y="57" fill="#B1C2B7" font-family="IBM Plex Sans,Arial,Helvetica,sans-serif" font-size="10" font-weight="600" text-anchor="start">TRAINING</text>
<text x="20" y="91" fill="#B1C2B7" font-family="IBM Plex Sans,Arial,Helvetica,sans-serif" font-size="11" font-weight="600" text-anchor="start">ACCOUNT</text>
<text x="20" y="125" fill="#EDF3EC" font-family="Libre Baskerville,Georgia,serif" font-size="28" font-weight="400" text-anchor="start">Recover access</text>
<text x="20" y="163" fill="#B1C2B7" font-family="IBM Plex Sans,Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="start">We will email a secure link if recovery is</text>
<text x="20" y="186" fill="#B1C2B7" font-family="IBM Plex Sans,Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="start">available for this account.</text>
<text x="20" y="254" fill="#B1C2B7" font-family="IBM Plex Sans,Arial,Helvetica,sans-serif" font-size="12" font-weight="600" text-anchor="start">Email address</text>
<rect x="20" y="262" width="350" height="52" rx="10" fill="#1C2B24" stroke="#526B5B"/>
<text x="34" y="296" fill="#EDF3EC" font-family="IBM Plex Sans,Arial,Helvetica,sans-serif" font-size="22" font-weight="600" text-anchor="start">you@example.com</text>
<rect x="20" y="344" width="350" height="48" rx="12" fill="#ACC6A6"/>
<text x="195.0" y="373.0" fill="#102219" font-family="IBM Plex Sans,Arial,Helvetica,sans-serif" font-size="14" font-weight="600" text-anchor="middle">Email me a reset link</text>
<rect x="20" y="427" width="350" height="114" rx="16" fill="#293F32" stroke="#526B5B"/>
<text x="36" y="455" fill="#EDF3EC" font-family="IBM Plex Sans,Arial,Helvetica,sans-serif" font-size="16" font-weight="600" text-anchor="start">Check your inbox</text>
<text x="36" y="477" fill="#B1C2B7" font-family="IBM Plex Sans,Arial,Helvetica,sans-serif" font-size="13" font-weight="400" text-anchor="start">Use the link to choose a new password. The link</text>
<text x="36" y="497" fill="#B1C2B7" font-family="IBM Plex Sans,Arial,Helvetica,sans-serif" font-size="13" font-weight="400" text-anchor="start">opens the password step directly.</text>
<rect x="20" y="596" width="350" height="48" rx="12" fill="#1C2B24" stroke="#526B5B"/>
<text x="195.0" y="625.0" fill="#EDF3EC" font-family="IBM Plex Sans,Arial,Helvetica,sans-serif" font-size="14" font-weight="600" text-anchor="middle">Back to sign in</text>
<text x="20" y="687" fill="#B1C2B7" font-family="IBM Plex Sans,Arial,Helvetica,sans-serif" font-size="13" font-weight="400" text-anchor="start">No account details or recovery availability are</text>
<text x="20" y="707" fill="#B1C2B7" font-family="IBM Plex Sans,Arial,Helvetica,sans-serif" font-size="13" font-weight="400" text-anchor="start">disclosed on this screen.</text>
<text x="20" y="763" fill="#B1C2B7" font-family="IBM Plex Sans,Arial,Helvetica,sans-serif" font-size="10" font-weight="400" text-anchor="start">Illustrative values • no real training records</text>
