<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc"><title id="title">Sign in to continue</title><desc id="desc">WorkoutApp unified design proposal. Synthetic example. Auth expiry pauses writes and preserves only a securely account-scoped local attempt where supported. Reauthenticate to the same account, then reconcile. Switching account never adopts or exposes the previous account draft.</desc><style>text{font-family:"DM Sans",Arial,sans-serif;font-variant-numeric:tabular-nums} @font-face{font-family:"DM Sans";src:url("../fonts/DM-Sans.ttf")}</style>
<rect x="0" y="0" width="390" height="844" rx="0" fill="#101010" data-fill-token="canvas"/>
<rect x="26" y="31" width="6" height="23" rx="2" fill="#C9383F" data-fill-token="action_fill"/>
<rect x="36" y="37" width="6" height="17" rx="2" fill="#C9383F" data-fill-token="action_fill"/>
<text x="53" y="50" fill="#F5F5F5" data-fill-token="text_primary" font-size="22" font-weight="700" text-anchor="start">WorkoutApp</text>
<path d="M20 74 L370 74" fill="none" stroke="#3B3B3B" stroke-width="1"/>
<text x="20" y="103" fill="#FF858B" data-fill-token="accent_text" font-size="13" font-weight="700" text-anchor="start">ACCOUNT</text>
<text x="20" y="140" fill="#F5F5F5" data-fill-token="text_primary" font-size="27" font-weight="700" text-anchor="start">Sign in to continue</text>
<text x="20" y="167" fill="#C2C2C2" data-fill-token="text_secondary" font-size="16" font-weight="400" text-anchor="start">Your session has expired.</text>
<rect x="20" y="206" width="350" height="73" rx="12" fill="#232323" data-fill-token="status_surface" stroke="#858585" stroke-width="1" data-stroke-token="border_control"/>
<text x="36" y="234" fill="#EBC17A" data-fill-token="warning_text" font-size="16" font-weight="600" text-anchor="start">Working-set entry held here</text>
<text x="36" y="258" fill="#C2C2C2" data-fill-token="text_secondary" font-size="14" font-weight="400" text-anchor="start">40 lb × 12 reps · save not confirmed</text>
<rect x="20" y="291" width="350" height="114" rx="12" fill="#191919" data-fill-token="surface" stroke="#3B3B3B" stroke-width="1" data-stroke-token="border_subtle"/>
<text x="36" y="320" fill="#F5F5F5" data-fill-token="text_primary" font-size="18" font-weight="600" text-anchor="start">Check the save after signing in</text>
<text x="36" y="350" fill="#C2C2C2" data-fill-token="text_secondary" font-size="15" font-weight="400" text-anchor="start">We will reconcile this attempt before</text>
<text x="36" y="372" fill="#C2C2C2" data-fill-token="text_secondary" font-size="15" font-weight="400" text-anchor="start">you enter another set.</text>
<rect x="20" y="682" width="350" height="48" rx="12" fill="#C9383F" data-fill-token="action_fill"/>
<text x="195.0" y="711.0" fill="#FFFFFF" data-fill-token="action_text" font-size="15" font-weight="600" text-anchor="middle">Sign in</text></svg>