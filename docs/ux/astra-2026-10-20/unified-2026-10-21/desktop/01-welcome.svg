<text x="415.0" y="745.0" fill="#FFFFFF" data-fill-token="action_text" font-size="15" font-weight="600" text-anchor="middle">Create an account</text>
<rect x="586" y="716" width="210" height="48" rx="12" fill="#191919" data-fill-token="surface" stroke="#858585" stroke-width="1" data-stroke-token="border_control"/>
<text x="691.0" y="745.0" fill="#F5F5F5" data-fill-token="text_primary" font-size="15" font-weight="600" text-anchor="middle">Sign in</text>
<rect x="968" y="104" width="436" height="96" rx="16" fill="#232323" data-fill-token="surface_raised"/>
<text x="988" y="138" fill="#F5F5F5" data-fill-token="text_primary" font-size="18" font-weight="600" text-anchor="start">WorkoutApp</text>
<text x="988" y="171" fill="#C2C2C2" data-fill-token="text_secondary" font-size="16" font-weight="400" text-anchor="start">Your setup</text>
<rect x="968" y="220" width="436" height="114" rx="12" fill="#191919" data-fill-token="surface" stroke="#3B3B3B" stroke-width="1" data-stroke-token="border_subtle"/>
<text x="984" y="249" fill="#F5F5F5" data-fill-token="text_primary" font-size="18" font-weight="600" text-anchor="start">WorkoutApp</text>
<text x="984" y="279" fill="#C2C2C2" data-fill-token="text_secondary" font-size="15" font-weight="400" text-anchor="start">Your programs, scheduled workouts and recorded</text>
<text x="984" y="301" fill="#C2C2C2" data-fill-token="text_secondary" font-size="15" font-weight="400" text-anchor="start">sets stay together.</text>
<rect x="968" y="346" width="436" height="114" rx="12" fill="#191919" data-fill-token="surface" stroke="#3B3B3B" stroke-width="1" data-stroke-token="border_subtle"/>
<text x="984" y="375" fill="#F5F5F5" data-fill-token="text_primary" font-size="18" font-weight="600" text-anchor="start">Keep your account</text>
<text x="984" y="405" fill="#C2C2C2" data-fill-token="text_secondary" font-size="15" font-weight="400" text-anchor="start">Returning members sign in directly. There is no</text>
<text x="984" y="427" fill="#C2C2C2" data-fill-token="text_secondary" font-size="15" font-weight="400" text-anchor="start">setup reset.</text>
<text x="972" y="852" fill="#A3A3A3" data-fill-token="text_muted" font-size="14" font-weight="400" text-anchor="start">WorkoutApp  /  Home</text></svg>