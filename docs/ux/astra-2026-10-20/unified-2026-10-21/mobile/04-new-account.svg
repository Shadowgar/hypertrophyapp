<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc"><title id="title">Make it yours</title><desc id="desc">WorkoutApp unified design proposal. Synthetic example. Create only a new account after explicit submit; do not choose a program or run generation as a hidden authentication side effect. Existing accounts route to sign-in.</desc><style>text{font-family:"DM Sans",Arial,sans-serif;font-variant-numeric:tabular-nums} @font-face{font-family:"DM Sans";src:url("../fonts/DM-Sans.ttf")}</style>
<rect x="0" y="0" width="390" height="844" rx="0" fill="#101010" data-fill-token="canvas"/>
<rect x="26" y="31" width="6" height="23" rx="2" fill="#C9383F" data-fill-token="action_fill"/>
<rect x="36" y="37" width="6" height="17" rx="2" fill="#C9383F" data-fill-token="action_fill"/>
<text x="53" y="50" fill="#F5F5F5" data-fill-token="text_primary" font-size="22" font-weight="700" text-anchor="start">WorkoutApp</text>
<path d="M20 74 L370 74" fill="none" stroke="#3B3B3B" stroke-width="1"/>
<text x="20" y="103" fill="#FF858B" data-fill-token="accent_text" font-size="13" font-weight="700" text-anchor="start">ACCOUNT</text>
<text x="20" y="140" fill="#F5F5F5" data-fill-token="text_primary" font-size="27" font-weight="700" text-anchor="start">Make it yours</text>
<text x="20" y="167" fill="#C2C2C2" data-fill-token="text_secondary" font-size="16" font-weight="400" text-anchor="start">Create your account, then choose a</text>
<text x="20" y="190" fill="#C2C2C2" data-fill-token="text_secondary" font-size="16" font-weight="400" text-anchor="start">program.</text>
<text x="20" y="240" fill="#C2C2C2" data-fill-token="text_secondary" font-size="14" font-weight="500" text-anchor="start">Email</text>
<rect x="20" y="250" width="350" height="52" rx="10" fill="#191919" data-fill-token="input_fill" stroke="#858585" stroke-width="1" data-stroke-token="border_control"/>
<text x="34" y="284.0" fill="#F5F5F5" data-fill-token="text_primary" font-size="16" font-weight="600" text-anchor="start">alex@example.com</text>
<text x="20" y="328" fill="#C2C2C2" data-fill-token="text_secondary" font-size="14" font-weight="500" text-anchor="start">Password</text>
<rect x="20" y="338" width="350" height="52" rx="10" fill="#191919" data-fill-token="input_fill" stroke="#858585" stroke-width="1" data-stroke-token="border_control"/>
<text x="34" y="372.0" fill="#F5F5F5" data-fill-token="text_primary" font-size="16" font-weight="600" text-anchor="start">••••••••••••</text>
<rect x="20" y="405" width="350" height="48" rx="12" fill="#191919" data-fill-token="surface" stroke="#858585" stroke-width="1" data-stroke-token="border_control"/>
<text x="195.0" y="434.0" fill="#F5F5F5" data-fill-token="text_primary" font-size="15" font-weight="600" text-anchor="middle">Show password</text>
<rect x="20" y="465" width="350" height="114" rx="12" fill="#191919" data-fill-token="surface" stroke="#3B3B3B" stroke-width="1" data-stroke-token="border_subtle"/>
<text x="36" y="494" fill="#F5F5F5" data-fill-token="text_primary" font-size="18" font-weight="600" text-anchor="start">Your choice comes next</text>
<text x="36" y="524" fill="#C2C2C2" data-fill-token="text_secondary" font-size="15" font-weight="400" text-anchor="start">You can review your setup before</text>
<text x="36" y="546" fill="#C2C2C2" data-fill-token="text_secondary" font-size="15" font-weight="400" text-anchor="start">starting training.</text>
